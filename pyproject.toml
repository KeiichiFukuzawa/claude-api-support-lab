[project]
name = "claude-api-support-lab"
version = "0.1.0"
description = "A small lab for diagnosing, documenting, and escalating Claude API errors."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Live tests call the real API. They are skipped unless you run `pytest -m live`.
addopts = "-m 'not live'"
markers = [
    "live: calls the real Claude API (needs ANTHROPIC_API_KEY, may cost a little money)",
]
